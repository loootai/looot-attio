name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The lockfile carries npm's deprecation notice for glob, which names its maintainer's address.
      - run: LEAK_SCAN_ALLOWED_EMAILS='^i@izs\.me$' bash scripts/leak-scan.sh .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
